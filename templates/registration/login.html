
{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 모니터링 시스템</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0077C8",
                        "background-light": "#f8fafc",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Noto Sans KR", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        /* 로딩 애니메이션 */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0077C8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 페이지 로더 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>
    
    <div class="container-fluid p-0">
<div class="flex items-center justify-center min-h-screen bg-slate-50/50">
    <div class="w-full max-w-md px-4">
    <!-- Main Card -->
    <div class="bg-white rounded-[2rem] border border-slate-100 shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-500">
        <!-- Header Section -->
        <div class="bg-primary/5 p-8 border-b border-slate-100 flex flex-col items-center text-center">
            <div class="size-20 bg-white rounded-full flex items-center justify-center mb-4 shadow-lg ring-4 ring-primary/5 overflow-hidden">
                 <img src="{% static 'images/logo.png' %}" alt="Logo" class="size-16 object-contain" onerror="this.src='https://via.placeholder.com/64?text=Logo'">
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-1">삼천리 웹모니터링</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Web Monitoring System</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="text-center">
                <h2 class="text-xl font-black text-slate-800">로그인</h2>
                <div class="h-1 w-12 bg-primary mx-auto mt-2 rounded-full"></div>
            </div>

            {% if form.errors %}
                <div class="p-4 rounded-2xl bg-red-50 text-red-700 text-sm font-medium flex items-start gap-3 border border-red-100">
                    <span class="material-symbols-outlined text-[20px] mt-0.5">error</span>
                    <div>
                        <p class="font-bold">로그인 실패</p>
                        <p class="text-xs mt-0.5 opacity-90">아이디 또는 비밀번호를 확인해주세요.</p>
                    </div>
                </div>
            {% endif %}

            <form method="post" id="loginForm" class="space-y-5">
                {% csrf_token %}
                
                <!-- Username -->
                <div class="space-y-2">
                    <label for="{{ form.username.id_for_label }}" class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">ID</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">person</span>
                        <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                               class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 focus:bg-white focus:ring-4 focus:ring-primary/10 focus:border-primary rounded-2xl text-slate-900 transition-all outline-none font-bold placeholder:text-slate-300"
                               placeholder="아이디를 입력하세요" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label for="{{ form.password.id_for_label }}" class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
                        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                               class="w-full pl-12 pr-12 py-4 bg-slate-50 border border-slate-100 focus:bg-white focus:ring-4 focus:ring-primary/10 focus:border-primary rounded-2xl text-slate-900 transition-all outline-none font-bold placeholder:text-slate-300"
                               placeholder="비밀번호를 입력하세요" required>
                        <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none p-1 transition-colors">
                            <span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Options -->
                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" id="rememberMe" class="peer appearance-none size-5 rounded-lg border-2 border-slate-200 checked:bg-primary checked:border-primary transition-all cursor-pointer">
                            <span class="material-symbols-outlined text-white text-[14px] absolute scale-0 peer-checked:scale-100 transition-transform pointer-events-none">check</span>
                        </div>
                        <span class="text-xs font-bold text-slate-500 group-hover:text-slate-700 transition-colors">자동 로그인</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                        class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-black rounded-2xl shadow-xl shadow-primary/20 transition-all flex items-center justify-center gap-2 group mt-8 active:scale-[0.98]">
                    <span>로그인</span>
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
            </form>
        </div>

        <div class="p-6 bg-slate-50/80 border-t border-slate-100 text-center">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">© 2026 삼천리 IT서비스 2팀. All rights reserved.</p>
        </div>
    </div>
    </div>
</div>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
</style>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <script>
        // 페이지 로드 완료 후 로더 숨김
        window.addEventListener('load', function() {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 300);
            }
        });

        // 3초 후 강제로 로더 제거 (실패 대비)
        setTimeout(() => {
            const loader = document.getElementById('pageLoader');
            if (loader && loader.style.display !== 'none') {
                loader.style.display = 'none';
            }
        }, 3000);
        
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('{{ form.password.id_for_label }}');
            const passwordIcon = document.getElementById('passwordIcon');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                });
            }

            if (loginForm) {
                loginForm.addEventListener('submit', function() {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
                    submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                });
            }
        });
    </script>
</body>
</html>
