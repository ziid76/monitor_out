{% extends "basic.html" %}

{% block page_name %}관리자 인증{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-20">
    <div class="bg-white p-10 rounded-2xl border border-slate-100 shadow-2xl w-full max-w-md">
        <div class="flex flex-col items-center gap-6">
            <div class="size-16 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                <span class="material-symbols-outlined text-4xl">lock</span>
            </div>
            
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-900">관리자 모드 접속</h2>
                <p class="text-slate-500 mt-2">등록 및 수정을 위해 인증코드를 입력해주세요.</p>
            </div>

            <form action="{% url 'web_monitor:manager_auth' %}" method="post" class="w-full flex flex-col gap-4">
                {% csrf_token %}
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">인증코드 (Access Code)</label>
                    <input type="password" name="access_code" placeholder="••••" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary/50 outline-none text-center text-2xl tracking-widest">
                </div>
                <button type="submit" class="w-full py-4 bg-primary text-white font-bold rounded-xl hover:bg-primary/90 transition-all shadow-lg shadow-primary/20">
                    인증하기
                </button>
            </form>
            
            <a href="{% url 'web_monitor:dashboard' %}" class="text-sm font-medium text-slate-400 hover:text-slate-600 transition-colors">
                대시보드로 돌아가기
            </a>
        </div>
    </div>
</div>
{% endblock %}
